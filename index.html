<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photon Chat Web</title>

  <!-- Photon Chat JS SDK 4.4.x -->
  <script src="js/photon.min.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 24px;
      background: #f5f5f5;
    }
    .card {
      max-width: 800px;
      margin: 0 auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      background: #fff;
    }
    h1 { font-size: 20px; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    input, button { padding: 10px; font-size: 14px; }
    input { flex: 1; }
    #messages {
      height: 320px;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px;
      overflow-y: auto;
      background: #fafafa;
    }
    .msg { margin: 6px 0; }
    .sys { color: #666; font-style: italic; }
    #chatArea { display: none; }
    #status { margin: 8px 0; color: #444; }
  </style>
</head>
<body>

<div class="card">
  <h1>Photon Chat Web – GlobalChat</h1>

  <div class="row">
    <input id="appId" value="c232cfbf-d1d0-435a-b5a9-afc32d97a4ef" />
    <input id="username" placeholder="Seu nome" />
    <button id="connectBtn">Conectar</button>
  </div>

  <div id="status" class="sys">Aguardando conexão…</div>

  <div id="chatArea">
    <div id="messages"></div>
    <div class="row" style="margin-top:12px;">
      <input id="msgBox" placeholder="Digite sua mensagem" />
      <button id="sendBtn">Enviar</button>
    </div>
  </div>
</div>

<script>
  const CHANNEL = "GlobalChat";
  const REGION = "us";
  const APP_VERSION = "1.0";

  let client = null;

  const el = id => document.getElementById(id);

  function setStatus(t) {
    el("status").textContent = t;
  }

  function addMsg(html, sys = false) {
    const p = document.createElement("p");
    p.className = "msg" + (sys ? " sys" : "");
    p.innerHTML = html;
    el("messages").appendChild(p);
    el("messages").scrollTop = el("messages").scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

function connect() {
  const appId = el("appId").value.trim();
  const user = el("username").value.trim() || "WebUser_" + Date.now();

  client = new Photon.Chat.ChatClient(
    Photon.ConnectionProtocol.Wss,
    appId,
    APP_VERSION
  );

  client.debugOutputLevel = Photon.LogLevel.INFO;

  client.onChatStateChange = state => {
    console.log("STATE:", Photon.Chat.ChatClient.State[state]);
    setStatus("Estado: " + Photon.Chat.ChatClient.State[state]);

    if (state === Photon.Chat.ChatClient.State.ConnectedToFrontEnd) {
      client.subscribe([CHANNEL]);
      el("chatArea").style.display = "block";
      addMsg(`Conectado como <b>${user}</b>.`, true);
    }
  };

  client.onMessage = (channel, sender, message) => {
    addMsg(`<b>${sender}:</b> ${escapeHtml(String(message))}`);
  };

  setStatus("Conectando ao Photon Chat…");

  client.connectToRegionFrontEnd(REGION, user);

  // 🔥 LOOP DE SERVIÇO (ESSENCIAL)
  setInterval(() => {
    if (client) client.service();
  }, 50);
}


  function sendMessage() {
    const msg = el("msgBox").value.trim();
    if (!msg) return;
    client.publishMessage(CHANNEL, msg);
    el("msgBox").value = "";
  }

  el("connectBtn").addEventListener("click", connect);
  el("sendBtn").addEventListener("click", sendMessage);
  el("msgBox").addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
